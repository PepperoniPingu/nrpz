name: ci

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.3"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.3"
          args: "format --check"
